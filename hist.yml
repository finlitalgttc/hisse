# Bu dosyayı repoda şu yola koy: .github/workflows/hist.yml
name: update-history
on:
  schedule:
    - cron: '0 22 * * 1-5'   # her iş günü piyasalar kapandıktan sonra
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node hist.mjs
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "gecmis guncellendi" && git pull --rebase && git push)
