# Temel veriler (F/K, PD/DD, temettü verimi...). Fiyata bağlı oranlar günde bir kez güncellenir.
name: update-fundamentals
on:
  schedule:
    - cron: '30 21 * * 1-5'   # NASDAQ kapanışından sonra
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fundamentals.mjs
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "temel veriler guncellendi" && git pull --rebase && git push)
